[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  "prompt_corpus/raw",
  "scripts",
  "**/*.ipynb",
]

[tool.ruff.lint]
select = [
  "E",    # syntax errors
  "F",    # undefined / unused
  "B",    # bugbear (bug patterns)
  "SIM",  # simplifications
]
ignore = [
  "E203", # black 互換
  "B904", # re-raise without `from`（router.py 仕様上 OK）
]
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
exclude = "(^scripts/|^tools/|^providers/.*_backup\\.py$)"

[[tool.mypy.overrides]]
module = ["insightface.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cv2.*"]
ignore_missing_imports = true
